<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlipMatch Online — Pemain</title>
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<header class="page-header">
  <div class="brand"><span class="brand-mark">F</span> FlipMatch Online</div>
  <span class="tag">Pemain</span>
</header>
<main class="container">
  <section id="joinPanel" class="card-section">
    <h2>Gabung Permainan</h2>
    <p class="hint">Masukkan kode room dari admin dan nama kamu, lalu tunggu admin memulai permainan.</p>
    <form id="joinForm" class="join-form">
      <label>Kode room
        <input id="codeInput" maxlength="8" placeholder="Contoh: AB12C" autocapitalize="characters" style="text-transform:uppercase">
      </label>
      <label>Nama kamu
        <input id="nameInput" maxlength="24" placeholder="Nama panggilan">
      </label>
      <p id="joinError" class="inline-error" hidden></p>
      <button class="btn primary large" type="submit">Gabung</button>
    </form>
  </section>

  <section id="waitPanel" class="card-section" hidden>
    <div class="wait-box">
      <div class="spinner"></div>
      <h2>Menunggu admin memulai permainan…</h2>
      <p class="hint">Halo, <strong id="waitName">-</strong>! Tetap buka halaman ini.</p>
      <p id="waitGroupInfo" class="muted"></p>
    </div>
  </section>

  <section id="playPanel" class="card-section" hidden>
    <p id="turnIndicator" class="turn-indicator" hidden>Giliran: <span id="turnName">-</span></p>
    <div class="game-header">
      <h1 id="gameTitleDisplay">FlipMatch</h1>
      <div class="stats">
        <div class="stat"><span>Cocok</span><strong><span id="matched">0</span>/<span id="totalPairs">0</span></strong></div>
        <div class="stat"><span>Langkah</span><strong id="moves">0</strong></div>
        <div class="stat"><span>Sisa waktu</span><strong id="timeLeft">00:00</strong></div>
      </div>
    </div>
    <div class="card-grid" id="cardGrid"></div>
  </section>

  <section id="resultPanel" class="card-section" hidden>
    <div class="result-panel">
      <div class="result-icon" id="resultIcon">🏆</div>
      <h2 id="resultTitle">Selesai!</h2>
      <p id="resultText" class="hint"></p>
      <div class="result-scores-online" id="resultScores"></div>
      <button id="backBtn" class="btn secondary" type="button">Gabung Room Lain</button>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="firebase-config.js"></script>
<script src="shared/game-logic.js"></script>
<script src="shared/store-local.js"></script>
<script src="shared/store-firebase.js"></script>
<script src="shared/store.js"></script>
<script src="player.js"></script>
</body>
</html>
